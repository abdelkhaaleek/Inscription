<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulaire d'inscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h2>Inscription</h2>
    <form id="signupForm">
      <label for="name">Nom complet :</label>
      <input type="text" id="name" placeholder="Entrez votre nom complet" required>

      <label for="email">Email :</label>
      <input type="email" id="email" placeholder="exemple@mail.com" required>

      <label for="phone">Numéro de téléphone :</label>
      <input type="tel" id="phone" placeholder="06XXXXXXXX" required pattern="[0-9]{10}">

      <label for="birthdate">Date de naissance :</label>
      <input type="date" id="birthdate" required>

      <label for="password">Mot de passe :</label>
      <input type="password" id="password" placeholder="********" required>

      <button type="submit">S'inscrire</button>
      <p id="message"></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
